<h1>Брокер доступа: блокировка(статистика)</h1>

<form>
  Порог неудачных входов в минуту:
  <input name="limit" value="{{ limit }}">
  <button>Применить</button>
</form>

<canvas id="c1" width="400" height="200"></canvas>
<canvas id="c2" width="300" height="200"></canvas>

<table border="1">
  <tr><th>Пользователь</th><th>Попыток</th><th>Статус</th></tr>
  {% for u, n, s in rows %}
  <tr><td>{{ u }}</td><td>{{ n }}</td><td>{{ s }}</td></tr>
  {% endfor %}
</table>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
new Chart(c1, {type: "bar", options: {responsive: false},
  data: {labels: {{ names|safe }}, datasets: [{label: "Попыток", data: {{ counts|safe }}}]}});
new Chart(c2, {type: "pie", options: {responsive: false},
  data: {labels: ["блок", "ок"], datasets: [{data: [{{ blocked }}, {{ ok }}]}]}});
</script>
